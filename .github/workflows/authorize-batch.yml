name: Authorize & Launch Frozen 100

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: authorize-frozen-batch
  cancel-in-progress: false

jobs:
  authorize-and-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLANKER_API_KEY: ${{ secrets.CLANKER_API_KEY }}
      DIRECT_DEPLOYER_PRIVATE_KEY: ${{ secrets.DIRECT_DEPLOYER_PRIVATE_KEY }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      LIVE_LAUNCH_ENABLED: 'true'
      BATCH_FILE: data/approval-batch.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production dependencies
        run: npm install --no-audit --no-fund

      - name: Require one secure deployment rail before authorization
        shell: bash
        run: |
          if [ -z "$CLANKER_API_KEY" ] && [ -z "$DIRECT_DEPLOYER_PRIVATE_KEY" ]; then
            echo 'No live deployment credential is configured.' >&2
            echo 'Add either CLANKER_API_KEY or DIRECT_DEPLOYER_PRIVATE_KEY as a GitHub Actions repository secret.' >&2
            exit 1
          fi

      - name: Record one authorization for the full frozen batch
        run: npm run authorize

      - name: Persist authorization record before financial broadcast
        run: |
          git config user.name 'black-swan-bot'
          git config user.email 'black-swan-bot@users.noreply.github.com'
          git add data/approval-batch.json
          if git diff --cached --quiet; then
            echo 'Batch was already authorized'
          else
            git commit -m 'chore: authorize frozen Black Swan batch [skip ci]'
            git push
          fi

      - name: Launch authorized 100 through available Clanker rail
        shell: bash
        run: |
          if [ -n "$CLANKER_API_KEY" ]; then
            echo 'Using Clanker authenticated deployment API.'
            npm run launch
          else
            echo 'Using direct Clanker V4 deployer.'
            npm run launch:direct
          fi

      - name: Persist launch ledger and results
        if: always()
        shell: bash
        run: |
          git pull --rebase || true
          git config user.name 'black-swan-bot'
          git config user.email 'black-swan-bot@users.noreply.github.com'
          git add data/launch-results.json data/direct-launch-results.json data/live-tokens.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No launch result changes to persist'
          else
            git commit -m 'chore: persist Black Swan launch results [skip ci]'
            git push
          fi
