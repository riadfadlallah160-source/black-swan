name: Live Narrative Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-narrative-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run scanner
        run: npm run scan
      - name: Build deduplicated launch batch
        run: npm run package
      - name: Persist scanner and launch-package state
        run: |
          git config user.name 'black-swan-bot'
          git config user.email 'black-swan-bot@users.noreply.github.com'
          git add data/latest.json data/history.json data/launch-batch.json data/package-history.json
          if git diff --cached --quiet; then
            echo 'No state change'
          else
            git commit -m 'chore: update live scan and launch batch [skip ci]'
            git push
          fi
