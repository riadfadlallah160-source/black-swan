name: Live Narrative Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-narrative-scan
  cancel-in-progress: true

jobs:
  scan-package-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      EXIT_VAULT_ADDRESS: ${{ vars.EXIT_VAULT_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install production dependencies
        run: npm install --no-audit --no-fund
      - name: Run scanner
        run: npm run scan
      - name: Verify launch-provider availability without transactions
        run: npm run verify:rails
      - name: Publish provider recommendation without transactions
        run: npm run provider:report
      - name: Build deduplicated Clanker launch packages
        run: npm run package
      - name: Accumulate and rotate 100-package wallet batches from Base chain state
        run: npm run queue
      - name: Build unsigned wallet call bundle for frozen batch
        run: npm run bundle
      - name: Monitor creator fees and founder claim readiness
        run: npm run monitor
      - name: Build consolidated founder exit authorization batch
        run: npm run exit:queue
      - name: Publish scanner, finance and approval state
        run: |
          git config user.name 'black-swan-bot'
          git config user.email 'black-swan-bot@users.noreply.github.com'
          git add data/rail-readiness.json data/provider-report.json data/latest.json data/history.json data/launch-batch.json data/package-history.json data/approval-pool.json data/finance-status.json data/live-tokens.json assets/generated/
          git add -A data/approval-batch.json data/wallet-launch-bundle.json data/batch-history.json data/exit-batch.json
          if git diff --cached --quiet; then
            echo 'No state change'
          else
            git commit -m 'chore: publish Black Swan operating state [skip ci]'
            git push
          fi
