name: Live Narrative Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-narrative-scan
  cancel-in-progress: true

jobs:
  scan-package-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      EXIT_VAULT_ADDRESS: ${{ vars.EXIT_VAULT_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install production dependencies
        run: npm install --no-audit --no-fund
      - name: Run scanner
        run: npm run scan
      - name: Build deduplicated Clanker launch packages
        run: npm run package
      - name: Accumulate one approval batch of up to 100 packages
        run: npm run queue
      - name: Monitor creator fees and founder exit readiness
        run: npm run monitor
      - name: Publish scanner, finance and approval state
        run: |
          git config user.name 'black-swan-bot'
          git config user.email 'black-swan-bot@users.noreply.github.com'
          git add data/latest.json data/history.json data/launch-batch.json data/package-history.json data/approval-pool.json data/finance-status.json data/live-tokens.json assets/generated/
          if [ -f data/approval-batch.json ]; then
            git add data/approval-batch.json
          fi
          if git diff --cached --quiet; then
            echo 'No state change'
          else
            git commit -m 'chore: publish Black Swan operating state [skip ci]'
            git push
          fi
